  "@aws-lambda-powertools/parameters": 2.35.0
  "@aws-sdk/client-cloudfront": 3.1111.0
  "@aws-sdk/client-cloudfront-keyvaluestore": 3.1111.0
  "@aws-sdk/client-s3": 3.1111.0
  "@aws-sdk/signature-v4a": 3.1111.0
  "@cspell/dict-people-names": 1.1.16
  "@date-fns/tz": 1.5.0
  "@middy/core": 7.7.4
  "@types/aws-lambda": 8.10.162
  "@types/ejs": 3.1.5
  "@types/node": 25.9.5
  aws-cdk: 2.1137.0
  aws-cdk-github-oidc: 5.0.2
  aws-cdk-lib: 2.265.0
  aws-sdk-client-mock: 4.1.0
  cdk-nag: 3.0.2
  constructs: 10.8.1
  cron-parser: 5.10.0
  cspell: 10.0.1
  date-fns: 4.4.0
  ejs: 6.0.1
  execa: 10.0.1
  happy-dom: 20.11.6
  markdownlint: 0.41.1
  markdownlint-cli2: 0.23.2
  npm-run-all2: 9.0.3
  prh: 6.0.6
  textlint: 15.8.0
  textlint-filter-rule-comments: 1.3.0
  textlint-rule-preset-ja-spacing: 3.0.3
  textlint-rule-preset-ja-technical-writing: 12.0.2
