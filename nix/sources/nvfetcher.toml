[duckstation-darwin]
src.github_tag = "stenzek/duckstation"
src.include_regex = 'v0\.1-\d+'
src.from_pattern = 'v(.+)'
src.to_pattern = '\1'
fetch.url = "https://github.com/stenzek/duckstation/releases/download/v$ver/duckstation-mac-release.zip"

[duckstation-linux]
src.github_tag = "stenzek/duckstation"
src.include_regex = 'v0\.1-\d+'
src.from_pattern = 'v(.+)'
src.to_pattern = '\1'
fetch.url = "https://github.com/stenzek/duckstation/releases/download/v$ver/DuckStation-arm64.AppImage"

[firple]
src.github = "negset/Firple"
fetch.url = "https://github.com/negset/Firple/releases/download/$ver/Firple.zip"

[toggl]
src.webpage = "https://toggl.com/toggl/desktop/downloads/latest-mac.yml"
src.regex = 'version: ([\d.]+)'
fetch.url = "https://toggl.com/toggl/desktop/downloads/Toggl-$ver-arm64.dmg"

[tailscale-gui]
src.webpage = "https://pkgs.tailscale.com/stable/?mode=json&os=darwin"
src.regex = '"MacZipsVersion": "([\d.]+)"'
fetch.url = "https://pkgs.tailscale.com/stable/Tailscale-$ver-macos.pkg"
