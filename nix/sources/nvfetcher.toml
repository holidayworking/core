# Download URLs carry a per-release hash, so track the whole zip URL from the
# auto-update feed and derive the version from it in the package.
[claude]
src.webpage = "https://downloads.claude.ai/releases/darwin/universal/RELEASES.json"
src.regex = '"url":\s*"(https://downloads\.claude\.ai/releases/darwin/universal/[\d.]+/Claude-[0-9a-f]+\.zip)"'
fetch.url = "$ver"

# The download endpoint only redirects to the versioned dmg, so read the
# version from its Location header (the same source Homebrew's livecheck uses).
[dropbox]
src.cmd = "curl -fsSI 'https://www.dropbox.com/download?plat=mac&full=1&arch=arm64' | sed -n 's|^location: .*/Dropbox%20\\([0-9.]*\\)\\.arm64\\.dmg.*|\\1|p'"
fetch.url = "https://edge.dropboxstatic.com/dbx-releng/client/Dropbox%20$ver.arm64.dmg"
# The default store name would keep the URL's space, which Nix rejects.
url.name = "Dropbox-$ver.arm64.dmg"

[duckstation-darwin]
src.github_tag = "stenzek/duckstation"
src.include_regex = 'v0\.1-\d+'
src.from_pattern = 'v(.+)'
src.to_pattern = '\1'
fetch.url = "https://github.com/stenzek/duckstation/releases/download/v$ver/duckstation-mac-release.zip"

[duckstation-linux]
src.github_tag = "stenzek/duckstation"
src.include_regex = 'v0\.1-\d+'
src.from_pattern = 'v(.+)'
src.to_pattern = '\1'
fetch.url = "https://github.com/stenzek/duckstation/releases/download/v$ver/DuckStation-arm64.AppImage"

[firple]
src.github = "negset/Firple"
fetch.url = "https://github.com/negset/Firple/releases/download/$ver/Firple.zip"

[herdr-gitview]
src.github_tag = "ChmaraX/herdr-gitview"
fetch.github = "ChmaraX/herdr-gitview"
cargo_lock = ["Cargo.lock"]

[herdr-nvim]
src.github_tag = "ChmaraX/herdr-nvim"
fetch.github = "ChmaraX/herdr-nvim"
cargo_lock = ["Cargo.lock"]

[herdr-terminal-notifier]
src.git = "https://github.com/dot/herdr-terminal-notifier"
fetch.github = "dot/herdr-terminal-notifier"

[karabiner-elements]
src.github = "pqrs-org/Karabiner-Elements"
src.from_pattern = 'v(.+)'
src.to_pattern = '\1'
fetch.url = "https://github.com/pqrs-org/Karabiner-Elements/releases/download/v$ver/Karabiner-Elements-$ver.dmg"

# Download URLs carry a per-release token, so track the whole arm64 dmg URL
# from the releases API and derive the version from it in the package.
[multiviewer]
src.webpage = "https://api.multiviewer.app/api/v1/releases/latest/"
src.regex = '"url":\s*"(https://releases\.multiviewer\.app/v/[^"]+/MultiViewer-[\d.]+-arm64\.dmg)"'
fetch.url = "$ver"

[toggl]
src.webpage = "https://toggl.com/toggl/desktop/downloads/latest-mac.yml"
src.regex = 'version: ([\d.]+)'
fetch.url = "https://toggl.com/toggl/desktop/downloads/Toggl-$ver-arm64.dmg"
