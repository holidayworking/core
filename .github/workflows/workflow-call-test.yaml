name: test (workflow call)

on:
  workflow_call:

jobs:
  vp-check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run lint
    timeout-minutes: 10

  nix-check:
    permissions:
      contents: read
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - run: nix flake check --all-systems --print-build-logs
    timeout-minutes: 10

  changes:
    permissions:
      pull-requests: read
    needs:
      - vp-check
      - nix-check
    runs-on: ubuntu-slim
    outputs:
      radicast: ${{ steps.filter.outputs.radicast }}
      photo: ${{ steps.filter.outputs.photo }}
      aws-infrastructure: ${{ steps.filter.outputs.aws-infrastructure }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            radicast:
              - "apps/radicast/**"
              - .github/workflows/test.yaml
              - .github/workflows/workflow-call-test.yaml
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
            photo:
              - "apps/photo/**"
              - .github/workflows/test.yaml
              - .github/workflows/workflow-call-test.yaml
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
            aws-infrastructure:
              - "infrastructures/aws/**"
              - .github/workflows/test.yaml
              - .github/workflows/workflow-call-test.yaml
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
            nix:
              - "**/*.nix"
              - .github/workflows/test.yaml
              - .github/workflows/workflow-call-test.yaml
              - flake.lock
    timeout-minutes: 5

  vp-test:
    permissions:
      contents: read
    needs:
      - changes
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: ./.github/actions/setup-docker
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
      - run: vp install
      - run: vp test
    timeout-minutes: 10

  radicast-diff:
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
      - vp-test
    if: ${{ needs.changes.outputs.radicast == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: ./.github/actions/setup-docker
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
      - run: vp install
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::445411728232:role/github-actions
          aws-region: ap-northeast-1
      - run: vp exec --filter radicast cdk synth
      - run: vp exec --filter radicast cdk diff --all
    timeout-minutes: 10

  photo-diff:
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
      - vp-test
    if: ${{ needs.changes.outputs.photo == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: ./.github/actions/setup-docker
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
      - run: vp install
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::445411728232:role/github-actions
          aws-region: ap-northeast-1
      - run: vp exec --filter photo cdk synth
      - run: vp exec --filter photo cdk diff --all
    timeout-minutes: 10

  aws-infrastructure-diff:
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
      - vp-test
    if: ${{ needs.changes.outputs.aws-infrastructure == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
      - run: vp install
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::445411728232:role/github-actions
          aws-region: ap-northeast-1
      - run: vp exec --filter @infrastructures/aws cdk synth
      - run: vp exec --filter @infrastructures/aws cdk diff --all
    timeout-minutes: 10

  nix-diff:
    permissions:
      contents: read
    needs:
      - changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "true"
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - uses: natsukium/nix-diff-action@4091452e4c7b3c7ea4ecbaec84be7f0066d810d7 # v1.1.1
        with:
          mode: diff-only
          attributes: |
            - displayName: ${{ matrix.host }}
              attribute: ${{ matrix.attribute }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - host: aries
            attribute: darwinConfigurations.aries.system
          - host: devShells.aarch64-darwin.default
            attribute: devShells.aarch64-darwin.default

  nix-diff-comment:
    permissions:
      actions: read
      pull-requests: write
    needs:
      - nix-diff
    runs-on: ubuntu-slim
    steps:
      - uses: natsukium/nix-diff-action@4091452e4c7b3c7ea4ecbaec84be7f0066d810d7 # v1.1.1
        with:
          mode: comment-only
    timeout-minutes: 5
