name: update sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 3"

jobs:
  update-sources:
    permissions: {}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - id: nvfetcher
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          nix run --inputs-from . nixpkgs#nvfetcher -- \
            --config nix/sources/nvfetcher.toml \
            --build-dir nix/sources/generated \
            --changelog "$RUNNER_TEMP/changelog"
          {
            echo "changelog<<EOF"
            sed 's/^/- /' "$RUNNER_TEMP/changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(deps): update sources"
          branch: "chore/update-sources"
          title: "chore(deps): update sources"
          body: ${{ steps.nvfetcher.outputs.changelog }}
          labels: |
            dependencies
    timeout-minutes: 30
